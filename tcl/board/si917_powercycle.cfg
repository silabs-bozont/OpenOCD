#
# Power-cycles the Si917 so its NWP reopens the bootloader window that flashing
# needs.  PA04 is resistor-bridged to RESET_N / POC_IN (the MOSFET was removed),
# so this line gates the target's supply: low powers it down, high boots it.
#
# Run this first, then attach with board/si917_flash.cfg to program an image.
# The reattach has to be a separate OpenOCD process, because the SWD switch
# sequence is only replayed when a new connection is opened.
#

source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 1000
reset_config srst_only srst_push_pull

source [find target/swj-dp.tcl]

set _CHIPNAME si917
swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id 0x2ba01477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap -defer-examine

# The target is powered down for part of this, so init cannot reach the DP.
catch {init}

adapter assert srst
sleep 200
adapter deassert srst
shutdown
