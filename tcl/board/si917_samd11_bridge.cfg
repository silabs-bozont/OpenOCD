#
# SAMD11 CMSIS-DAP USB bridge to SiWx917 (SIWG917M111MGTBA)
#

source [find interface/cmsis-dap.cfg]
# Uncomment if multiple CMSIS-DAP adapters are attached
# adapter serial FBC1C0B6

transport select swd

# SAMD11 bit-bang is well below the advertised 20 MHz
adapter speed 100

# PA04 is resistor-bridged to Si917 RESET_N / POC_IN (MOSFET removed).  Pulling
# that net low powers the device down for good; only the SJ1 ISP jumper brings
# it back.  Never touch it.
reset_config none separate

source [find target/si917.cfg]
