#
# Attaches to an Si917 that has just been power-cycled, while the NWP is still
# in the bootloader window its mailbox reports as 0xab11.  Use it together with
# flash_si917.sh, which does the power cycle in a separate OpenOCD process:
# the SWD switch sequence has to be replayed after the device drops, and only a
# fresh connection does that.
#
# The reset/POC net is left alone here.  PA04 is resistor-bridged to the Si917
# RESET_N / POC_IN pin (the MOSFET was removed), so asserting it powers the
# device down rather than resetting it.
#

source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 1000
reset_config none separate

source [find target/swj-dp.tcl]

set _CHIPNAME si917
swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id 0x2ba01477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap

flash bank $_CHIPNAME.flash siwx917 0x08201000 0x005ff000 0 0 $_CHIPNAME.cpu
